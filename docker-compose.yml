# Starts this frontend on its own. NEXT_PUBLIC_API_URL is used by the
# browser, not this container, so no Docker networking tricks needed.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-admin-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

volumes:
  frontend-node-modules:
  frontend-next-cache:
